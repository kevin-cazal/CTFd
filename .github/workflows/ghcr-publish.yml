name: Publish to GHCR

on:
  release:
    types: [published]
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: false
        default: latest

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set image name and tags
        id: image
        run: |
          if [ -n "${{ vars.GHCR_IMAGE_NAME }}" ]; then
            image_name="${{ vars.GHCR_IMAGE_NAME }}"
          else
            image_name="ghcr.io/${GITHUB_REPOSITORY@L}"
          fi

          if [ "${{ github.event_name }}" = "release" ]; then
            image_tag="${{ github.event.release.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            image_tag="${GITHUB_REF#refs/tags/}"
          elif [ "${{ github.ref }}" = "refs/heads/master" ]; then
            image_tag="latest"
            image_tag_sha="sha-${GITHUB_SHA::7}"
          else
            image_tag="${{ github.event.inputs.tag }}"
          fi

          {
            echo "name=${image_name}"
            echo "tag=${image_tag}"
            echo "tags<<EOF"
            echo "${image_name}:${image_tag}"
            if [ -n "${image_tag_sha:-}" ]; then
              echo "${image_name}:${image_tag_sha}"
            fi
            if [ "${image_tag}" != "latest" ]; then
              echo "${image_name}:latest"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.image.outputs.tags }}
